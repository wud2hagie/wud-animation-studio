version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Addis_Ababa"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "lucide-react"
        versions: [">=1.0.0"]
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      production-patch-minor:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
