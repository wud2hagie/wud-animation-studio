name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || echo "::warning::Development dependency advisories remain; review job log."
      - name: Build Next.js application
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-only-not-a-production-secret
          NEXTAUTH_URL: http://localhost:3000
          ADMIN_EMAIL: ci-admin@example.invalid
          ADMIN_PASSWORD: ci-only-password-not-used-1234
